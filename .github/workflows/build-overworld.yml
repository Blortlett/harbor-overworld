name: Build Harbor Overworld

on:
  push:
    branches: [ overworld ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install build tools
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.100.0
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o "$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $archive.tar.gz" | sha256sum --check
          tar -xzf "$archive.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 "$archive/wasm-bindgen"
      - name: Build WASM, SDK and site
        run: |
          pnpm install --filter harbor-overworld... --frozen-lockfile
          pnpm --filter @polycentric/rs-core-wasm build --profile wasm-release
          pnpm --filter @polycentric/js-core generate
          pnpm --filter @polycentric/js-core build
          pnpm --filter @polycentric/js-browser build
          pnpm --filter harbor-overworld typecheck
          pnpm --filter harbor-overworld build
      - name: Check static output
        working-directory: apps/harbor-overworld/dist
        run: |
          test -s index.html && test -s licenses.txt
          compgen -G 'assets/*.wasm' > /dev/null
          compgen -G 'assets/*.js' > /dev/null
      - name: Bundle presence server
        run: pnpm --filter harbor-overworld build:presence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test standalone presence on Node 22
        run: node --test apps/harbor-overworld/server/presence.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overworld-site
          path: apps/harbor-overworld/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overworld-presence
          path: apps/harbor-overworld/dist-presence/server.mjs
          if-no-files-found: error
