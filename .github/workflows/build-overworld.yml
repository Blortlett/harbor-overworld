name: Build Harbor Overworld

on:
  push:
    branches: [ overworld ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: overworld-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASM_PROFILE: wasm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Identify build cache inputs
        id: cache-keys
        env:
          JS_INPUTS: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.pnpmfile.cjs', 'patches/**') }}
          WASM_INPUTS: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '**/.cargo/**', 'rust-toolchain*', 'packages/rs-core/**', 'packages/rs-common/**', 'packages/rs-core-wasm/**', 'protos/**', 'apps/harbor-overworld/scripts/install-wasm-tools.sh') }}
          SDK_INPUTS: ${{ hashFiles('packages/js-core/**', 'packages/js-browser/**', 'tools/tsconfig/**', 'buf.yaml', 'buf.gen.yaml', 'buf.lock') }}
        run: |
          # Hash before restoring any generated files. Bump the relevant schema
          # version if its build recipe or outputs change outside these inputs.
          test -n "$JS_INPUTS" && test -n "$WASM_INPUTS" && test -n "$SDK_INPUTS" || exit 1
          source /etc/os-release
          platform="$RUNNER_OS-$RUNNER_ARCH-$ID$VERSION_ID"
          pnpm_version=$(node -p 'require("./package.json").packageManager')
          js="$platform-$(node --version)-$pnpm_version-$JS_INPUTS"
          wasm="overworld-wasm-v2-$js-$WASM_PROFILE-$WASM_INPUTS"
          printf 'pnpm=%s\nwasm=%s\nsdk=%s\n' \
            "overworld-pnpm-v1-$js" "$wasm" "harbor-sdk-v2-$wasm-$SDK_INPUTS" >> "$GITHUB_OUTPUT"
      - name: Restore compiled WASM and bindings
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/rs-core-wasm/src/generated/wasm
            packages/rs-core-wasm/dist/node
          key: ${{ steps.cache-keys.outputs.wasm }}
      - name: Restore generated and compiled Harbor SDK
        id: sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/js-core/src/proto
            packages/js-core/dist
            packages/js-browser/dist
          key: ${{ steps.cache-keys.outputs.sdk }}
      - name: Install pnpm
        id: pnpm
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          store=$(pnpm store path)
          printf 'store=%s\n' "$store" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ steps.cache-keys.outputs.pnpm }}
      - name: Install JavaScript dependencies
        run: pnpm install --filter harbor-overworld... --frozen-lockfile --prefer-offline
      - name: Install WASM build tools
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          bash apps/harbor-overworld/scripts/install-wasm-tools.sh
      - name: Build WASM and bindings
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @polycentric/rs-core-wasm build --profile "$WASM_PROFILE"
          git diff --exit-code -- Cargo.lock
      - name: Build Harbor SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @polycentric/js-core generate
          pnpm --filter @polycentric/js-core build
          pnpm --filter @polycentric/js-browser build
      - name: Check types and build site
        run: |
          pnpm --filter harbor-overworld typecheck
          pnpm --filter harbor-overworld build
      - name: Check static output
        working-directory: apps/harbor-overworld/dist
        run: |
          test -s index.html && test -s licenses.txt
          compgen -G 'assets/*.wasm' > /dev/null
          compgen -G 'assets/*.js' > /dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test movement and standalone presence on Node 22
        run: |
          pnpm --filter harbor-overworld test:movement
          pnpm --filter harbor-overworld test:presence
      - name: Package release
        run: bash apps/harbor-overworld/scripts/package-release.sh "$RUNNER_TEMP/overworld-release" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overworld-release
          path: ${{ runner.temp }}/overworld-release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.repository == 'SomewhatJustin/harbor-overworld'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: overworld-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overworld-release
          path: ${{ runner.temp }}/overworld-release
      - name: Publish tested artifacts
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/harbor-overworld/scripts/publish-release.sh "$RUNNER_TEMP/overworld-release"
      - name: Notify deployment host
        if: steps.release.outputs.published == 'true' && vars.OVERWORLD_DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.OVERWORLD_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.OVERWORLD_DEPLOY_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test -n "$DEPLOY_TOKEN"
          if ! curl --fail --silent --show-error --max-time 10 --proto '=https' \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "X-Overworld-Release: $RELEASE_TAG" \
            --json "@$RUNNER_TEMP/overworld-release/build.json" "$DEPLOY_URL" --output /dev/null; then
            printf '::warning::Deployment notification failed. The live check will continue.\n'
          fi

  verify:
    if: github.event_name == 'push' && github.repository == 'SomewhatJustin/harbor-overworld'
    # The host consumes the tested build artifact; publishing is independent.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: overworld-verify
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify the live site and room
        env:
          OVERWORLD_SITE: ${{ vars.OVERWORLD_SITE || 'https://overworld.justin.how' }}
        run: node apps/harbor-overworld/scripts/check-live.mjs "$OVERWORLD_SITE" "$GITHUB_SHA" --wait=180
